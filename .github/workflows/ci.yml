name: Continuous Integration

on:
  push:
    branches: [ master, main ]
    paths:
      - 'kube-dump.sh'
      - '.github/workflows/ci.yml'
  pull_request:
    branches: [ master, main ]
    paths:
      - 'kube-dump.sh'
      - '.github/workflows/ci.yml'
  schedule:
    - cron: '0 2 * * 0'  # Weekly on Sundays at 2 AM UTC
  workflow_dispatch:

permissions:
  contents: write

jobs:
  shellcheck:
    name: ShellCheck
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        token: ${{ secrets.GITHUB_TOKEN }}

    - name: Install ShellCheck
      run: |
        sudo apt-get update
        sudo apt-get install -y shellcheck
        shellcheck --version

    - name: Run ShellCheck analysis
      id: shellcheck
      run: |
        if shellcheck -f gcc kube-dump.sh > /tmp/shellcheck-raw.txt 2>&1; then
          echo "status=✅ PASSED" >> $GITHUB_OUTPUT
          echo "issues=0" >> $GITHUB_OUTPUT
        else
          echo "status=⚠️ ISSUES FOUND" >> $GITHUB_OUTPUT
          echo "issues=$(wc -l < /tmp/shellcheck-raw.txt)" >> $GITHUB_OUTPUT
        fi

    - name: Generate ShellCheck report
      run: |
        {
          echo "# Code Quality Report - ShellCheck Analysis"
          echo ""
          echo "**Generated:** $(date -u '+%Y-%m-%d %H:%M:%S UTC')"
          echo "**ShellCheck Version:** $(shellcheck --version | head -2 | tail -1)"
          echo ""

          if [ -s /tmp/shellcheck-raw.txt ]; then
            echo "## ⚠️ Issues Found: $(wc -l < /tmp/shellcheck-raw.txt)"
            echo ""
            echo '```'
            cat /tmp/shellcheck-raw.txt
            echo '```'
          else
            echo "## ✅ No Issues Found"
            echo ""
            echo "All ShellCheck validations passed successfully."
          fi
        } > docs/code-quality.md

    - name: Update README
      run: bash scripts/update-documentation.sh "${{ steps.shellcheck.outputs.status }}" "${{ steps.shellcheck.outputs.issues }}"

    - name: Commit and push
      run: |
        git config user.name "GitHub Actions"
        git config user.email "actions@github.com"

        if git diff --quiet; then
          echo "No changes to commit"
        else
          git add README.md docs/code-quality.md
          git commit -m "ci: Update ShellCheck results"
          git push origin master || echo "Push failed"
        fi
